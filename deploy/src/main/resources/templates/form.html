<!DOCTYPE html>
<html>
<head>
    <title>Form Input Mahasiswa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<div class="card p-4 mx-auto" style="max-width: 600px;">
    <h3>Form Input Mahasiswa</h3>
    <form action="/save" method="post">
        <div class="mb-3">
            <label>Nama:</label>
            <input type="text" name="nama" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>NIM:</label>
            <input type="text" name="nim" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Jenis Kelamin:</label><br>
            <input type="radio" name="jenisKelamin" value="Laki-laki" required> Laki-laki
            <input type="radio" name="jenisKelamin" value="Perempuan" class="ms-3"> Perempuan
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        <a href="/home" class="ms-3 text-decoration-none">Kembali ke Home</a>
    </form>
</div>
</body>
</html>
