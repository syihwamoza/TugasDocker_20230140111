<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home - My Website</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<header class="d-flex justify-content-between border-bottom pb-3 mb-4">
    <h2 th:text="'MY Website ' + ${myNim}"></h2>
    <a href="/logout" class="btn btn-danger">Logout</a>
</header>

<h4>Selamat datang di aplikasi!</h4>
<a href="/form" class="btn btn-success mb-3">Input Data Mahasiswa</a>

<table class="table table-striped border">
    <thead class="table-dark">
    <tr>
        <th>No</th>
        <th>Nama</th>
        <th>NIM</th>
        <th>Jenis Kelamin</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="mhs, iter : ${dataMhs}">
        <td th:text="${iter.count}"></td>
        <td th:text="${mhs.nama}"></td>
        <td th:text="${mhs.nim}"></td>
        <td th:text="${mhs.jenisKelamin}"></td>
    </tr>
    <tr th:if="${dataMhs.empty}">
        <td colspan="4" class="text-center">Belum ada data</td>
    </tr>
    </tbody>
</table>
</body>
</html>
