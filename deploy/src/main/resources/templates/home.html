<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home - My Website</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-5">

<!-- 🔥 Banner + Gambar -->
<div class="position-relative mb-4">
    <img th:src="@{/images/banner.png}"
         class="img-fluid rounded w-100 shadow"
         style="max-height: 250px; object-fit: cover;">

    <!-- Tulisan di atas gambar -->
    <div class="position-absolute top-50 start-50 translate-middle text-white text-center">
        <h2 class="fw-bold">Dashboard Mahasiswa</h2>
        <p>Semangat ngoding hari ini 💪</p>
    </div>
</div>

<!-- 🔹 Header -->
<header class="d-flex justify-content-between border-bottom pb-3 mb-4">
    <h2 th:text="'MY Website ' + ${myNim}"></h2>
    <a href="/logout" class="btn btn-danger">Logout</a>
</header>

<!-- 🔹 Kata-kata -->
<h4>Kata kata hari ini semoga ga error 😭</h4>
<h4>Selamat datang di aplikasi!</h4>

<!-- 🔹 Button -->
<a href="/form" class="btn btn-success mb-3">Input Data Mahasiswa</a>

<!-- 🔹 Tabel -->
<table class="table table-striped border shadow-sm">
    <thead class="table-dark">
    <tr>
        <th>No</th>
        <th>Nama</th>
        <th>NIM</th>
        <th>Jenis Kelamin</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="mhs, iter : ${dataMhs}">
        <td th:text="${iter.count}"></td>
        <td th:text="${mhs.nama}"></td>
        <td th:text="${mhs.nim}"></td>
        <td th:text="${mhs.jenisKelamin}"></td>
    </tr>

    <!-- Kalau kosong -->
    <tr th:if="${dataMhs.empty}">
        <td colspan="4" class="text-center">Belum ada data</td>
    </tr>
    </tbody>
</table>

</body>
</html>
